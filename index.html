<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HeeHee Sprite Tracker</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #0f0f0f;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      margin-bottom: 25px;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #888;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
      font-size: 14px;
    }

    /* =========================
       ACCOUNT
    ========================= */

    .account-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .account-name {
      color: #aaa;
      font-size: 13px;
    }

    button {
      font-family: inherit;
    }

    .account-button {
      border: 1px solid #444;
      background: #1b1b1b;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .account-button:hover {
      background: #292929;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-panel {
      margin-bottom: 25px;
      padding: 18px;
      border: 1px solid #333;
      border-radius: 14px;
      background: #151515;
    }

    .login-panel h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .login-fields {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .login-fields input {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #202020;
      color: #fff;
    }

    .login-submit {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #292929;
      color: #fff;
      cursor: pointer;
    }

    .login-message {
      margin-top: 10px;
      font-size: 13px;
      color: #999;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .controls input,
    .controls select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #181818;
      color: #fff;
    }

    .controls input {
      flex: 1;
      min-width: 220px;
    }

    /* =========================
       COLLECTION DASHBOARD
    ========================= */

    .collection-dashboard {
      margin: 25px 0;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 14px;
      background: #151515;
    }

    .collection-header {
      margin-bottom: 18px;
    }

    .collection-title {
      font-size: 20px;
      font-weight: 700;
    }

    .collection-player {
      margin-top: 4px;
      font-size: 13px;
      color: #888;
    }

    .collection-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .collection-stat {
      padding: 14px;
      border-radius: 10px;
      background: #202020;
      text-align: center;
    }

    .collection-stat-number {
      font-size: 22px;
      font-weight: 700;
    }

    .collection-stat-label {
      margin-top: 3px;
      font-size: 12px;
      color: #888;
    }

    .collection-progress {
      margin-top: 20px;
    }

    .collection-progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 13px;
      color: #aaa;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      border-radius: 10px;
      overflow: hidden;
      background: #292929;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 10px;
      background: #777;
      transition: width 0.3s ease;
    }

    /* =========================
       SPRITE GRID
    ========================= */

    #sprites {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .sprite-card {
      background: #171717;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease;
    }

    .sprite-card:hover {
      transform: translateY(-3px);
      border-color: #555;
    }

    .sprite-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .sprite-info {
      padding: 12px;
    }

    .sprite-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .rarity {
      font-size: 12px;
      color: #aaa;
    }

    .season {
      margin-top: 3px;
      font-size: 11px;
      color: #666;
    }

    .message {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      color: #777;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px 15px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      width: 100%;
      max-width: 800px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 25px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #444;
      background: #202020;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    .modal-main {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 25px;
      margin-bottom: 25px;
    }

    .modal-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
    }

    .modal-title {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 26px;
    }

    .modal-rarity {
      color: #aaa;
      margin-bottom: 8px;
    }

    .modal-season {
      color: #777;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .modal-description {
      color: #bbb;
      line-height: 1.5;
      font-size: 14px;
    }

    .modal-ability {
      margin-top: 15px;
      color: #aaa;
      font-size: 14px;
    }

    /* =========================
       VARIANTS
    ========================= */

    .variants-title {
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: 700;
    }

    #modalVariants {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .variant-card {
      background: #1d1d1d;
      border: 1px solid #303030;
      border-radius: 12px;
      overflow: hidden;
    }

    .variant-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .variant-info {
      padding: 12px;
    }

    .variant-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .variant-type {
      color: #777;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .variant-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .owned-button,
    .mastered-button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #252525;
      color: #ccc;
      cursor: pointer;
    }

    .owned-button:hover,
    .mastered-button:hover {
      background: #303030;
    }

    .owned-button.owned {
      background: #303030;
      color: #fff;
    }

    .mastered-button.mastered {
      background: #353535;
      color: #fff;
    }

    .level-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .level-control label {
      font-size: 12px;
      color: #888;
    }

    .level-input {
      flex: 1;
      min-width: 0;
      padding: 7px;
      border-radius: 7px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
    }

    .no-variants {
      grid-column: 1 / -1;
      padding: 20px;
      color: #777;
      text-align: center;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 20px 12px;
      }

      .modal-main {
        grid-template-columns: 1fr;
      }

      .modal-image {
        max-width: 250px;
        margin: 0 auto;
      }

    }

    @media (max-width: 600px) {

      .collection-stats {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <header>

      <div class="brand">
        HEEHEE
      </div>

      <h1>
        Fortnite Sprite Tracker
      </h1>

      <div class="subtitle">
        Collect every Sprite in Fortnite.
      </div>

    </header>


    <!-- =========================
         ACCOUNT
    ========================= -->

    <div class="account-bar">

      <span
        id="accountName"
        class="account-name"
      >
        Not logged in
      </span>

      <button
        id="loginButton"
        class="account-button"
      >
        Login
      </button>

      <button
        id="logoutButton"
        class="account-button"
        style="display: none;"
      >
        Logout
      </button>

    </div>


    <!-- =========================
         LOGIN PANEL
    ========================= -->

    <div
      id="loginPanel"
      class="login-panel"
      style="display: none;"
    >

      <h2>
        Login
      </h2>

      <div class="login-fields">

        <input
          id="emailInput"
          type="email"
          placeholder="Email"
        >

        <input
          id="passwordInput"
          type="password"
          placeholder="Password"
        >

        <button
          id="loginSubmit"
          class="login-submit"
        >
          Login
        </button>

      </div>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </div>


    <!-- =========================
         CONTROLS
    ========================= -->

    <div class="controls">

      <input
        id="search"
        type="text"
        placeholder="Search sprites..."
      >

      <select id="rarity">

        <option value="All">
          All Rarities
        </option>

        <option value="Rare">
          Rare
        </option>

        <option value="Epic">
          Epic
        </option>

        <option value="Legendary">
          Legendary
        </option>

        <option value="Mythic">
          Mythic
        </option>

      </select>

    </div>


    <!-- =========================
         COLLECTION DASHBOARD
    ========================= -->

    <div
      id="collectionDashboard"
      class="collection-dashboard"
    >

      <div class="collection-header">

        <div class="collection-title">
          My Collection
        </div>

        <div class="collection-player">

          <span id="collectionPlayer">
            Not logged in
          </span>

        </div>

      </div>


      <div class="collection-stats">

        <div class="collection-stat">

          <div
            id="collectionTotal"
            class="collection-stat-number"
          >
            0
          </div>

          <div class="collection-stat-label">
            Total
          </div>

        </div>


        <div class="collection-stat">

          <div
            id="collectionOwned"
            class="collection-stat-number"
          >
            0
          </div>

          <div class="collection-stat-label">
            Owned
          </div>

        </div>


        <div class="collection-stat">

          <div
            id="collectionMissing"
            class="collection-stat-number"
          >
            0
          </div>

          <div class="collection-stat-label">
            Missing
          </div>

        </div>


        <div class="collection-stat">

          <div
            id="collectionMastered"
            class="collection-stat-number"
          >
            0
          </div>

          <div class="collection-stat-label">
            Mastered
          </div>

        </div>

      </div>


      <div class="collection-progress">

        <div class="collection-progress-top">

          <span>
            Completion
          </span>

          <span id="collectionCompletion">
            0%
          </span>

        </div>


        <div class="progress-bar">

          <div
            id="collectionProgressFill"
            class="progress-fill"
          ></div>

        </div>

      </div>

    </div>


    <!-- =========================
         SPRITES
    ========================= -->

    <div id="stats" class="subtitle">
      Loading sprites...
    </div>

    <div
      id="sprites"
      style="margin-top: 15px;"
    ></div>

  </div>


  <!-- =========================
       MODAL
  ========================= -->

  <div
    id="spriteModal"
    class="modal"
  >

    <div class="modal-content">

      <button
        id="modalClose"
        class="modal-close"
      >
        ×
      </button>


      <div class="modal-main">

        <img
          id="modalImage"
          class="modal-image"
          src=""
          alt=""
        >


        <div>

          <h2
            id="modalTitle"
            class="modal-title"
          ></h2>

          <div
            id="modalRarity"
            class="modal-rarity"
          ></div>

          <div
            id="modalSeason"
            class="modal-season"
          ></div>

          <div
            id="modalDescription"
            class="modal-description"
          ></div>

          <div
            id="modalAbility"
            class="modal-ability"
          ></div>

        </div>

      </div>


      <div class="variants-title">
        Variants
      </div>

      <div id="modalVariants"></div>

    </div>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://mvspchowsinkymgytyeb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_mbdvlfY7O8Mb61KtZYoimw_b9Aer0Sb";


    /* =========================
       DATA
    ========================= */

    let allSprites = [];

    let allVariants = [];

    let accessToken = null;

    let refreshToken = null;

    let currentUser = null;

    let currentPlayer = null;

    let myCollection = [];


    /* =========================
       SUPABASE REQUEST
    ========================= */

    async function supabaseRequest(
      endpoint,
      options = {}
    ) {

      const headers = {

        "apikey":
          SUPABASE_KEY,

        "Authorization":
          "Bearer " +
          (
            accessToken ||
            SUPABASE_KEY
          ),

        "Content-Type":
          "application/json",

        ...(options.headers || {})

      };


      return fetch(
        SUPABASE_URL + endpoint,
        {
          ...options,
          headers
        }
      );

    }


    /* =========================
       LOAD SPRITES
    ========================= */

    async function loadSprites() {

      const response =
        await supabaseRequest(
          "/rest/v1/sprites" +
          "?select=*" +
          "&active=eq.true"
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Could not load sprites: " +
          error
        );

      }


      allSprites =
        await response.json();


      console.log(
        "Sprites loaded:",
        allSprites.length
      );


      renderSprites();

      updateCollectionStats();

    }


    /* =========================
       LOAD VARIANTS
    ========================= */

    async function loadVariants() {

      const response =
        await supabaseRequest(
          "/rest/v1/variants" +
          "?select=*" +
          "&active=eq.true"
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Could not load variants: " +
          error
        );

      }


      allVariants =
        await response.json();


      console.log(
        "Variants loaded:",
        allVariants.length
      );


      updateCollectionStats();

    }


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const email =
        document
          .getElementById("emailInput")
          .value
          .trim();

      const password =
        document
          .getElementById("passwordInput")
          .value;


      const message =
        document.getElementById(
          "loginMessage"
        );


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        return;

      }


      message.textContent =
        "Logging in...";


      const response =
        await fetch(
          SUPABASE_URL +
          "/auth/v1/token?grant_type=password",
          {
            method: "POST",

            headers: {
              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        console.error(
          "Login error:",
          data
        );

        message.textContent =
          data.error_description ||
          data.msg ||
          "Login failed.";

        return;

      }


      accessToken =
        data.access_token;

      refreshToken =
        data.refresh_token;


      localStorage.setItem(
        "accessToken",
        accessToken
      );

      localStorage.setItem(
        "refreshToken",
        refreshToken
      );


      await loadCurrentUser();

      await loadPlayer();

      await loadMyCollection();


      updateAccountUI();

      updateCollectionStats();


      document.getElementById(
        "loginPanel"
      ).style.display =
        "none";


      message.textContent = "";

    }


    /* =========================
       LOAD CURRENT USER
    ========================= */

    async function loadCurrentUser() {

      const response =
        await supabaseRequest(
          "/auth/v1/user"
        );


      if (!response.ok) {

        throw new Error(
          "Could not load current user."
        );

      }


      currentUser =
        await response.json();


      console.log(
        "Current user:",
        currentUser
      );

    }


    /* =========================
       LOAD PLAYER
    ========================= */

    async function loadPlayer() {

      if (!currentUser) {

        currentPlayer = null;

        return;

      }


      const response =
        await supabaseRequest(
          "/rest/v1/players" +
          "?select=*" +
          "&auth_user_id=eq." +
          encodeURIComponent(
            currentUser.id
          )
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Could not load player: " +
          error
        );

      }


      const players =
        await response.json();


      currentPlayer =
        players.length
          ? players[0]
          : null;


      console.log(
        "Current player:",
        currentPlayer
      );

    }


    /* =========================
       LOAD COLLECTION
    ========================= */

    async function loadMyCollection() {

      if (!currentPlayer) {

        myCollection = [];

        updateCollectionStats();

        return;

      }


      const response =
        await supabaseRequest(
          "/rest/v1/collections" +
          "?select=*" +
          "&player_id=eq." +
          encodeURIComponent(
            currentPlayer.player_id
          )
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Could not load collection: " +
          error
        );

      }


      myCollection =
        await response.json();


      console.log(
        "My collection:",
        myCollection
      );


      updateCollectionStats();

    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

      accessToken = null;

      refreshToken = null;

      currentUser = null;

      currentPlayer = null;

      myCollection = [];


      localStorage.removeItem(
        "accessToken"
      );

      localStorage.removeItem(
        "refreshToken"
      );


      updateAccountUI();

      updateCollectionStats();

      renderSprites();

    }


    /* =========================
       ACCOUNT UI
    ========================= */

    function updateAccountUI() {

      const accountName =
        document.getElementById(
          "accountName"
        );

      const loginButton =
        document.getElementById(
          "loginButton"
        );

      const logoutButton =
        document.getElementById(
          "logoutButton"
        );


      if (currentPlayer) {

        accountName.textContent =
          currentPlayer.display_name ||
          "Logged in";

        loginButton.style.display =
          "none";

        logoutButton.style.display =
          "inline-block";

      } else {

        accountName.textContent =
          "Not logged in";

        loginButton.style.display =
          "inline-block";

        logoutButton.style.display =
          "none";

      }

    }


    /* =========================
       RESTORE SESSION
    ========================= */

    async function restoreSession() {

      const storedAccessToken =
        localStorage.getItem(
          "accessToken"
        );

      const storedRefreshToken =
        localStorage.getItem(
          "refreshToken"
        );


      if (!storedAccessToken) {

        updateAccountUI();

        return;

      }


      accessToken =
        storedAccessToken;

      refreshToken =
        storedRefreshToken;


      try {

        await loadCurrentUser();

        await loadPlayer();

        await loadMyCollection();

        updateAccountUI();

      } catch (error) {

        console.error(
          "Session restore failed:",
          error
        );

        logout();

      }

    }


    /* =========================
       RENDER SPRITES
    ========================= */

    function renderSprites() {

      const container =
        document.getElementById(
          "sprites"
        );


      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase();


      const rarity =
        document.getElementById(
          "rarity"
        ).value;


      const filtered =
        allSprites.filter(
          sprite => {

            const name =
              sprite.sprite_name ||
              "";


            const matchesSearch =
              name
                .toLowerCase()
                .includes(search);


            const matchesRarity =
              rarity === "All" ||
              sprite.rarity === rarity;


            return (
              matchesSearch &&
              matchesRarity
            );

          }
        );


      container.innerHTML = "";


      if (!filtered.length) {

        container.innerHTML = `
          <div class="message">
            No sprites found.
          </div>
        `;

        updateStats(0);

        return;

      }


      filtered.forEach(
        sprite => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "sprite-card";


          card.innerHTML = `

            <img
              class="sprite-image"
              src="${sprite.image_url || ""}"
              alt="${sprite.sprite_name || ""}"
            >

            <div class="sprite-info">

              <div class="sprite-name">
                ${sprite.sprite_name || "Unknown"}
              </div>

              <div class="rarity">
                ${sprite.rarity || "Unknown"}
              </div>

              <div class="season">
                ${sprite.season || ""}
              </div>

            </div>

          `;


          card.addEventListener(
            "click",
            () =>
              openModal(sprite)
          );


          container.appendChild(
            card
          );

        }
      );


      updateStats(
        filtered.length
      );

    }


    /* =========================
       UPDATE SPRITE STATS
    ========================= */

    function updateStats(
      count
    ) {

      document.getElementById(
        "stats"
      ).textContent =
        count +
        " of " +
        allSprites.length +
        " sprites";

    }


    /* =========================
       COLLECTION STATS
    ========================= */

    function updateCollectionStats() {

      const total =
        allVariants.filter(
          variant =>
            variant.active !== false
        ).length;


      const owned =
        myCollection.filter(
          item =>
            item.owned === true
        ).length;


      const mastered =
        myCollection.filter(
          item =>
            item.mastered === true
        ).length;


      const missing =
        Math.max(
          total - owned,
          0
        );


      const completion =
        total > 0
          ? Math.round(
              (owned / total) * 100
            )
          : 0;


      const totalElement =
        document.getElementById(
          "collectionTotal"
        );


      const ownedElement =
        document.getElementById(
          "collectionOwned"
        );


      const missingElement =
        document.getElementById(
          "collectionMissing"
        );


      const masteredElement =
        document.getElementById(
          "collectionMastered"
        );


      const completionElement =
        document.getElementById(
          "collectionCompletion"
        );


      const progressElement =
        document.getElementById(
          "collectionProgressFill"
        );


      if (totalElement) {

        totalElement.textContent =
          total;

      }


      if (ownedElement) {

        ownedElement.textContent =
          owned;

      }


      if (missingElement) {

        missingElement.textContent =
          missing;

      }


      if (masteredElement) {

        masteredElement.textContent =
          mastered;

      }


      if (completionElement) {

        completionElement.textContent =
          completion + "%";

      }


      if (progressElement) {

        progressElement.style.width =
          completion + "%";

      }


      const playerElement =
        document.getElementById(
          "collectionPlayer"
        );


      if (playerElement) {

        playerElement.textContent =
          currentPlayer
            ? currentPlayer.display_name
            : "Not logged in";

      }

    }


    /* =========================
       OPEN MODAL
    ========================= */

    function openModal(
      sprite
    ) {

      document.getElementById(
        "modalImage"
      ).src =
        sprite.image_url || "";


      document.getElementById(
        "modalImage"
      ).alt =
        sprite.sprite_name || "";


      document.getElementById(
        "modalTitle"
      ).textContent =
        sprite.sprite_name ||
        "Unknown";


      document.getElementById(
        "modalRarity"
      ).textContent =
        sprite.rarity ||
        "";


      document.getElementById(
        "modalSeason"
      ).textContent =
        sprite.season
          ? "Season " +
            sprite.season
          : "";


      document.getElementById(
        "modalDescription"
      ).textContent =
        sprite.description ||
        "No description available.";


      document.getElementById(
        "modalAbility"
      ).textContent =
        sprite.ability
          ? "Ability: " +
            sprite.ability
          : "";


      renderVariants(
        sprite.sprite_id
      );


      document.getElementById(
        "spriteModal"
      ).classList.add(
        "show"
      );

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

      document.getElementById(
        "spriteModal"
      ).classList.remove(
        "show"
      );

    }


    /* =========================
       RENDER VARIANTS
    ========================= */

    function renderVariants(
      spriteId
    ) {

      const container =
        document.getElementById(
          "modalVariants"
        );


      const variants =
        allVariants.filter(
          variant =>
            variant.sprite_id ===
              spriteId &&
            variant.active !== false
        );


      container.innerHTML = "";


      if (!variants.length) {

        container.innerHTML = `
          <div class="no-variants">
            No variants available.
          </div>
        `;

        return;

      }


      variants.forEach(
        variant => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "variant-card";


          const collection =
            myCollection.find(
              item =>
                item.variant_id ===
                variant.variant_id
            );


          const owned =
            collection?.owned === true;


          const mastered =
            collection?.mastered === true;


          card.innerHTML = `

            <img
              class="variant-image"
              src="${variant.image_url || ""}"
              alt="${variant.variant_name || ""}"
            >

            <div class="variant-info">

              <div class="variant-name">
                ${variant.variant_name || "Variant"}
              </div>

              ${
                variant.variant_type
                  ? `
                    <div class="variant-type">
                      ${variant.variant_type}
                    </div>
                  `
                  : ""
              }

              <div class="variant-controls">

                <button
                  class="owned-button ${
                    owned ? "owned" : ""
                  }"
                  data-variant-id="${variant.variant_id}"
                >
                  ${
                    owned
                      ? "★ Owned"
                      : "☆ Owned"
                  }
                </button>

                ${
                  owned
                    ? `

                      <div class="level-control">

                        <label>
                          Level
                        </label>

                        <input
                          type="number"
                          class="level-input"
                          min="1"
                          max="999"
                          value="${
                            collection?.level ??
                            ""
                          }"
                          placeholder="—"
                          data-variant-id="${variant.variant_id}"
                        >

                      </div>


                      <button
                        class="mastered-button ${
                          mastered
                            ? "mastered"
                            : ""
                        }"
                        data-variant-id="${variant.variant_id}"
                      >
                        ${
                          mastered
                            ? "🏆 Mastered"
                            : "☆ Mastered"
                        }
                      </button>

                    `
                    : ""
                }

              </div>

            </div>

          `;


          const ownedButton =
            card.querySelector(
              ".owned-button"
            );


          ownedButton.addEventListener(
            "click",
            async event => {

              event.stopPropagation();


              try {

                await toggleOwned(
                  variant.variant_id
                );


                renderVariants(
                  spriteId
                );

              } catch (error) {

                console.error(
                  error
                );

                alert(
                  "Could not update collection."
                );

              }

            }
          );


          const levelInput =
            card.querySelector(
              ".level-input"
            );


          if (levelInput) {

            levelInput.addEventListener(
              "change",
              async event => {

                event.stopPropagation();


                try {

                  await updateVariantLevel(
                    variant.variant_id,
                    event.target.value
                  );


                  renderVariants(
                    spriteId
                  );

                } catch (error) {

                  console.error(
                    error
                  );

                  alert(
                    "Could not update level."
                  );

                }

              }
            );

          }


          const masteredButton =
            card.querySelector(
              ".mastered-button"
            );


          if (masteredButton) {

            masteredButton.addEventListener(
              "click",
              async event => {

                event.stopPropagation();


                try {

                  await toggleMastered(
                    variant.variant_id
                  );


                  renderVariants(
                    spriteId
                  );

                } catch (error) {

                  console.error(
                    error
                  );

                  alert(
                    "Could not update mastery."
                  );

                }

              }
            );

          }


          container.appendChild(
            card
          );

        }
      );

    }


    /* =========================
       TOGGLE OWNED
    ========================= */

    async function toggleOwned(
      variantId
    ) {

      if (
        !currentPlayer ||
        !accessToken
      ) {

        alert(
          "Please log in first."
        );

        return;

      }


      const existing =
        myCollection.find(
          item =>
            item.variant_id ===
            variantId
        );


      const now =
        new Date().toISOString();


      if (existing) {

        const newOwned =
          existing.owned !== true;


        const response =
          await supabaseRequest(
            "/rest/v1/collections" +
            "?player_id=eq." +
            encodeURIComponent(
              currentPlayer.player_id
            ) +
            "&variant_id=eq." +
            encodeURIComponent(
              variantId
            ),
            {

              method: "PATCH",

              headers: {

                "Prefer":
                  "return=representation"

              },

              body:
                JSON.stringify({

                  owned:
                    newOwned,

                  last_updated:
                    now

                })

            }
          );


        if (!response.ok) {

          const error =
            await response.text();

          throw new Error(
            "Could not update collection: " +
            error
          );

        }


        const updated =
          await response.json();


        if (updated.length) {

          const index =
            myCollection.findIndex(
              item =>
                item.variant_id ===
                variantId
            );


          if (index !== -1) {

            myCollection[index] =
              updated[0];

          }

        }


        updateCollectionStats();

        return;

      }


      const collectionId =
        "COL_" +
        currentPlayer.player_id +
        "_" +
        variantId;


      const response =
        await supabaseRequest(
          "/rest/v1/collections",
          {

            method: "POST",

            headers: {

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify({

                collection_id:
                  collectionId,

                player_id:
                  currentPlayer.player_id,

                variant_id:
                  variantId,

                owned:
                  true,

                level:
                  null,

                mastered:
                  false,

                last_updated:
                  now,

                first_collected:
                  now,

                first_mastered:
                  null

              })

          }
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Could not add to collection: " +
          error
        );

      }


      const created =
        await response.json();


      if (created.length) {

        myCollection.push(
          created[0]
        );

      }


      updateCollectionStats();

    }


    /* =========================
       UPDATE LEVEL
    ========================= */

    async function updateVariantLevel(
      variantId,
      level
    ) {

      if (
        !currentPlayer ||
        !accessToken
      ) {

        return;

      }


      const response =
        await supabaseRequest(
          "/rest/v1/collections" +
          "?player_id=eq." +
          encodeURIComponent(
            currentPlayer.player_id
          ) +
          "&variant_id=eq." +
          encodeURIComponent(
            variantId
          ),
          {

            method: "PATCH",

            headers: {

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify({

                level:
                  level === ""
                    ? null
                    : Number(level),

                last_updated:
                  new Date().toISOString()

              })

          }
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Could not update level: " +
          error
        );

      }


      const updated =
        await response.json();


      if (updated.length) {

        const index =
          myCollection.findIndex(
            item =>
              item.variant_id ===
              variantId
          );


        if (index !== -1) {

          myCollection[index] =
            updated[0];

        }

      }


      updateCollectionStats();

    }


    /* =========================
       TOGGLE MASTERED
    ========================= */

    async function toggleMastered(
      variantId
    ) {

      if (
        !currentPlayer ||
        !accessToken
      ) {

        return;

      }


      const existing =
        myCollection.find(
          item =>
            item.variant_id ===
            variantId
        );


      if (!existing) {

        return;

      }


      const newMastered =
        existing.mastered !== true;


      const now =
        new Date().toISOString();


      const response =
        await supabaseRequest(
          "/rest/v1/collections" +
          "?player_id=eq." +
          encodeURIComponent(
            currentPlayer.player_id
          ) +
          "&variant_id=eq." +
          encodeURIComponent(
            variantId
          ),
          {

            method: "PATCH",

            headers: {

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify({

                mastered:
                  newMastered,

                first_mastered:
                  newMastered
                    ? (
                        existing.first_mastered ||
                        now
                      )
                    : existing.first_mastered,

                last_updated:
                  now

              })

          }
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Could not update mastered: " +
          error
        );

      }


      const updated =
        await response.json();


      if (updated.length) {

        const index =
          myCollection.findIndex(
            item =>
              item.variant_id ===
              variantId
          );


        if (index !== -1) {

          myCollection[index] =
            updated[0];

        }

      }


      updateCollectionStats();

    }


    /* =========================
       EVENTS
    ========================= */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        renderSprites
      );


    document
      .getElementById("rarity")
      .addEventListener(
        "change",
        renderSprites
      );


    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        () => {

          const panel =
            document.getElementById(
              "loginPanel"
            );


          panel.style.display =
            panel.style.display ===
            "none"
              ? "block"
              : "none";

        }
      );


    document
      .getElementById("loginSubmit")
      .addEventListener(
        "click",
        login
      );


    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        logout
      );


    document
      .getElementById("modalClose")
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById("spriteModal")
      .addEventListener(
        "click",
        event => {

          if (
            event.target.id ===
            "spriteModal"
          ) {

            closeModal();

          }

        }
      );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* =========================
       START TRACKER
    ========================= */

    async function startTracker() {

      try {

        await Promise.all([

          loadSprites(),

          loadVariants(),

          restoreSession()

        ]);


        updateCollectionStats();

        updateAccountUI();


      } catch (error) {

        console.error(
          "Tracker error:",
          error
        );


        document.getElementById(
          "stats"
        ).textContent =
          "Tracker error: " +
          error.message;

      }

    }


    startTracker();

  </script>
