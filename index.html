<script>

const SUPABASE_URL =
  "https://mvspchowsinkymgytyeb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_mbdvlfY7O8Mb61KtZYoimw_b9Aer0Sb";


let allSprites = [];
let allVariants = [];

let accessToken = null;
let currentUser = null;
let currentPlayer = null;

let myCollection = [];


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseRequest(
  endpoint,
  options = {}
) {

  const headers = {

    "apikey":
      SUPABASE_KEY,

    "Content-Type":
      "application/json",

    ...(options.headers || {})

  };


  if (accessToken) {

    headers["Authorization"] =
      "Bearer " + accessToken;

  } else {

    headers["Authorization"] =
      "Bearer " + SUPABASE_KEY;

  }


  return fetch(
    SUPABASE_URL + endpoint,
    {
      ...options,
      headers
    }
  );

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document
      .getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;

  }


  message.textContent =
    "Logging in...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            email:
              email,

            password:
              password

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Login failed."
      );

    }


    accessToken =
      data.access_token;

    currentUser =
      data.user;


    /* SAVE SESSION */

    localStorage.setItem(
      "heehee_access_token",
      accessToken
    );


    if (data.refresh_token) {

      localStorage.setItem(
        "heehee_refresh_token",
        data.refresh_token
      );

    }


    await loadPlayer();
await loadMyCollection();


    message.textContent =
      "Login successful.";

    updateAccountUI();

  } catch (error) {

    console.error(error);

    message.textContent =
      error.message;

  }

}


/* =========================
   LOAD PLAYER
========================= */

async function loadPlayer() {

  if (!currentUser) {
    return;
  }


  const response =
    await supabaseRequest(
      "/rest/v1/players" +
      "?select=*" +
      "&auth_user_id=eq." +
      encodeURIComponent(
        currentUser.id
      )
    );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(
      "Could not load player: " +
      error
    );

  }


  const players =
    await response.json();


  if (!players.length) {

    throw new Error(
      "Your account exists, but no player record is connected to it."
    );

  }


  currentPlayer =
    players[0];

}

  async function loadMyCollection() {
  if (!currentPlayer) {
    myCollection = [];
    return;
  }

  const response = await supabaseRequest(
    "/rest/v1/collections" +
    "?select=*" +
    "&player_id=eq." +
    encodeURIComponent(currentPlayer.player_id)
  );

  if (!response.ok) {
    const error = await response.text();
    throw new Error("Could not load collection: " + error);
  }

  myCollection = await response.json();

  console.log("My collection:", myCollection);
}

/* =========================
   UPDATE ACCOUNT UI
========================= */

function updateAccountUI() {

  const accountName =
    document.getElementById(
      "accountName"
    );

  const loginButton =
    document.getElementById(
      "loginButton"
    );

  const logoutButton =
    document.getElementById(
      "logoutButton"
    );

  const loginPanel =
    document.getElementById(
      "loginPanel"
    );


  if (currentPlayer) {

    accountName.textContent =
      currentPlayer.display_name ||
      currentPlayer.discord_name ||
      "Player";

    loginButton.style.display =
      "none";

    logoutButton.style.display =
      "block";

    loginPanel.classList.remove(
      "open"
    );

  } else {

    accountName.textContent =
      "Not logged in";

    loginButton.style.display =
      "block";

    logoutButton.style.display =
      "none";

  }

}


/* =========================
   LOGOUT
========================= */

function logout() {

  accessToken = null;
  currentUser = null;
  currentPlayer = null;


  localStorage.removeItem(
    "heehee_access_token"
  );

  localStorage.removeItem(
    "heehee_refresh_token"
  );


  updateAccountUI();

}


/* =========================
   RESTORE SESSION
========================= */

async function restoreSession() {

  const savedToken =
    localStorage.getItem(
      "heehee_access_token"
    );


  if (!savedToken) {

    updateAccountUI();

    return;

  }


  accessToken =
    savedToken;


  try {

    const response =
      await supabaseRequest(
        "/auth/v1/user"
      );


    if (!response.ok) {

      throw new Error(
        "Session expired."
      );

    }


    currentUser =
      await response.json();


    await loadPlayer();
await loadMyCollection();

    updateAccountUI();

  } catch (error) {

    console.log(
      "Session restore failed:",
      error.message
    );

    logout();

  }

}


/* =========================
   LOAD SPRITES
========================= */

async function loadSprites() {

  const container =
    document.getElementById(
      "sprites"
    );

  const stats =
    document.getElementById(
      "stats"
    );


  try {

    const response =
      await supabaseRequest(
        "/rest/v1/sprites?select=*"
      );


    if (!response.ok) {

      throw new Error(
        "Supabase returned " +
        response.status
      );

    }


    allSprites =
      await response.json();


    renderSprites();

  } catch (error) {

    console.error(error);

    stats.textContent =
      "Collection error: " +
      error.message;

  }

}


/* =========================
   LOAD VARIANTS
========================= */

async function loadVariants() {

  try {

    const response =
      await supabaseRequest(
        "/rest/v1/variants?select=*"
      );


    if (!response.ok) {

      throw new Error(
        "Supabase returned " +
        response.status
      );

    }


    allVariants =
      await response.json();

  } catch (error) {

    console.error(
      "Variant loading error:",
      error
    );

  }

}


/* =========================
   RENDER SPRITES
========================= */

function renderSprites() {

  const container =
    document.getElementById(
      "sprites"
    );


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const rarity =
    document.getElementById(
      "rarity"
    ).value;


  const filtered =
    allSprites.filter(
      sprite => {

        const name =
          sprite.sprite_name || "";


        const matchesSearch =
          name
            .toLowerCase()
            .includes(search);


        const matchesRarity =
          rarity === "All" ||
          sprite.rarity === rarity;


        return (
          matchesSearch &&
          matchesRarity
        );

      }
    );


  container.innerHTML = "";


  if (!filtered.length) {

    container.innerHTML = `
      <div class="message">
        No sprites found.
      </div>
    `;

    updateStats(0);

    return;

  }


  filtered.forEach(
    sprite => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "sprite-card";


      card.innerHTML = `

        <img
          class="sprite-image"
          src="${sprite.image_url || ""}"
          alt="${sprite.sprite_name || ""}"
        >

        <div class="sprite-info">

          <div class="sprite-name">
            ${sprite.sprite_name || "Unknown"}
          </div>

          <div class="rarity">
            ${sprite.rarity || "Unknown"}
          </div>

          <div class="season">
            ${sprite.season || ""}
          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        () => openModal(sprite)
      );


      container.appendChild(
        card
      );

    }
  );


  updateStats(
    filtered.length
  );

}


/* =========================
   UPDATE STATS
========================= */

function updateStats(
  count
) {

  document.getElementById(
    "stats"
  ).textContent =
    count +
    " of " +
    allSprites.length +
    " sprites";

}


/* =========================
   OPEN MODAL
========================= */

function openModal(
  sprite
) {

  const modal =
    document.getElementById(
      "spriteModal"
    );


  document.getElementById(
    "modalImage"
  ).src =
    sprite.image_url || "";


  document.getElementById(
    "modalImage"
  ).alt =
    sprite.sprite_name || "";


  document.getElementById(
    "modalName"
  ).textContent =
    sprite.sprite_name ||
    "Unknown";


  document.getElementById(
    "modalRarity"
  ).textContent =
    "Rarity: " +
    (
      sprite.rarity ||
      "Unknown"
    );


  document.getElementById(
    "modalSeason"
  ).textContent =
    sprite.season || "";


  document.getElementById(
    "modalDescription"
  ).textContent =
    sprite.description ||
    "No description available.";


  /* ABILITY */

  const abilitySection =
    document.getElementById(
      "abilitySection"
    );

  const ability =
    document.getElementById(
      "modalAbility"
    );


  if (sprite.ability) {

    ability.textContent =
      sprite.ability;

    abilitySection.style.display =
      "block";

  } else {

    abilitySection.style.display =
      "none";

  }


  /* MAX LEVEL */

  const levelSection =
    document.getElementById(
      "levelSection"
    );

  const level =
    document.getElementById(
      "modalLevel"
    );


  if (sprite.max_level) {

    level.textContent =
      sprite.max_level;

    levelSection.style.display =
      "block";

  } else {

    levelSection.style.display =
      "none";

  }


  /* VARIANTS */

  renderVariants(
    sprite.sprite_id
  );


  modal.classList.add(
    "open"
  );

}


/* =========================
   RENDER VARIANTS
========================= */

function renderVariants(spriteId) {

  const container =
    document.getElementById(
      "modalVariants"
    );


  const variants =
    allVariants.filter(
      variant =>
        variant.sprite_id ===
          spriteId &&
        variant.active !== false
    );


  container.innerHTML =
    "";


  if (!variants.length) {

    container.innerHTML = `
      <div class="no-variants">
        No variants available.
      </div>
    `;

    return;

  }


  variants.forEach(
    variant => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "variant-card";


      const collection =
        myCollection.find(
          item =>
            item.variant_id ===
            variant.variant_id
        );


      const owned =
        collection?.owned === true;


      card.innerHTML = `

        <img
          class="variant-image"
          src="${variant.image_url || ""}"
          alt="${variant.variant_name || ""}"
        >

        <div class="variant-controls">

  <button
    class="owned-button ${owned ? "owned" : ""}"
    data-variant-id="${variant.variant_id}"
  >
    ${owned ? "★ Owned" : "☆ Owned"}
  </button>

  ${
    owned
      ? `
        <div class="level-control">

          <label>
            Level
          </label>

          <input
            type="number"
            class="level-input"
            min="1"
            max="999"
            value="${collection?.level ?? ""}"
            placeholder="—"
            data-variant-id="${variant.variant_id}"
          >

        </div>

        <button
          class="mastered-button ${
            collection?.mastered === true
              ? "mastered"
              : ""
          }"
          data-variant-id="${variant.variant_id}"
        >
          ${
            collection?.mastered === true
              ? "🏆 Mastered"
              : "☆ Mastered"
          }
        </button>
      `
      : ""
  }

</div>

      `;


      const ownedButton =
        card.querySelector(
          ".owned-button"
        );


      ownedButton.addEventListener(
        "click",
        async event => {

          event.stopPropagation();

          await toggleOwned(
            variant.variant_id
          );

          renderVariants(
            spriteId
          );

        }
      );


      container.appendChild(
        card
      );

    }
  );

}
  async function toggleOwned(variantId) {

  if (!currentPlayer || !accessToken) {
    alert("Please log in first.");
    return;
  }

  const existing =
    myCollection.find(
      item =>
        item.variant_id === variantId
    );

  const now =
    new Date().toISOString();

  if (existing) {

    const newOwned =
      existing.owned !== true;

    const response =
      await supabaseRequest(
        "/rest/v1/collections" +
        "?player_id=eq." +
        encodeURIComponent(
          currentPlayer.player_id
        ) +
        "&variant_id=eq." +
        encodeURIComponent(
          variantId
        ),
        {
          method: "PATCH",

          headers: {
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({

            owned:
              newOwned,

            last_updated:
              now,

            first_collected:
              existing.first_collected ||
              (newOwned ? now : null)

          })
        }
      );

    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(
        "Could not update collection: " +
        error
      );
    }

    const updated =
      await response.json();

    if (updated.length) {

      const index =
        myCollection.findIndex(
          item =>
            item.variant_id ===
            variantId
        );

      myCollection[index] =
        updated[0];
    }

    return;
  }

  const collectionId =
    "COL_" +
    currentPlayer.player_id +
    "_" +
    variantId;

  const response =
    await supabaseRequest(
      "/rest/v1/collections",
      {
        method: "POST",

        headers: {
          "Prefer":
            "return=representation"
        },

        body: JSON.stringify({

          collection_id:
            collectionId,

          player_id:
            currentPlayer.player_id,

          variant_id:
            variantId,

          owned:
            true,

          level:
            null,

          mastered:
            false,

          last_updated:
            now,

          first_collected:
            now,

          first_mastered:
            null

        })
      }
    );

  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(
      "Could not add to collection: " +
      error
    );
  }

  const created =
    await response.json();

  if (created.length) {

    myCollection.push(
      created[0]
    );
  }

}
