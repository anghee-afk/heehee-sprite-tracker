<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HeeHee Sprite Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 40px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    #sprites {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .sprite-card {
      background: #1d1d1d;
      border-radius: 12px;
      padding: 15px;
      overflow: hidden;
    }

    .sprite-card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #292929;
      border-radius: 8px;
    }

    .sprite-name {
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
    }

    .rarity {
      color: #aaa;
      margin-top: 5px;
    }

    .season {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }

    #status {
      margin-bottom: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <h1>HeeHee Sprite Tracker</h1>

  <div class="subtitle">
    Fortnite Sprite Collection
  </div>

  <div id="status">
    Loading sprites...
  </div>

  <div id="sprites"></div>


  <script>

    const SUPABASE_URL = "https://mvspchowsinkymgytyeb.supabase.co/rest/v1/";

    const SUPABASE_KEY = "sb_publishable_mbdvlfY7O8Mb61KtZYoimw_b9Aer0Sb";


    async function loadSprites() {

      const status = document.getElementById("status");
      const container = document.getElementById("sprites");

      try {

        const response = await fetch(
          SUPABASE_URL + "/sprites?select=*",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            }
          }
        );


        if (!response.ok) {
          throw new Error(
            "Supabase returned " + response.status
          );
        }


        const sprites = await response.json();


        status.textContent =
          sprites.length + " sprites loaded.";


        sprites.forEach(sprite => {

          const card = document.createElement("div");

          card.className = "sprite-card";


          card.innerHTML = `

            <img
              src="${sprite.image_url}"
              alt="${sprite.sprite_name}"
            >

            <div class="sprite-name">
              ${sprite.sprite_name}
            </div>

            <div class="rarity">
              ${sprite.rarity}
            </div>

            <div class="season">
              ${sprite.season}
            </div>

          `;


          container.appendChild(card);

        });


      } catch (error) {

        console.error(error);

        status.textContent =
          "Collection error: " + error.message;

      }

    }


    loadSprites();

  </script>

</body>
</html>
