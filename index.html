<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HeeHee Sprite Tracker</title>


  <style>

    /* =========================
       THEME
    ========================= */

    :root {

      --bg: #0b0b0f;
      --surface: #121218;
      --surface-2: #181820;
      --surface-3: #20202a;

      --border: #292936;
      --border-hover: #45455a;

      --text: #f5f5f7;
      --text-soft: #b4b4c2;
      --text-muted: #777785;

      --purple: #a78bfa;
      --purple-bright: #c4b5fd;

      --blue: #60a5fa;
      --blue-bright: #93c5fd;

      --gradient:
        linear-gradient(
          135deg,
          #a78bfa,
          #60a5fa
        );

    }


    /* =========================
       GLOBAL
    ========================= */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 30px 20px;

      background:
        radial-gradient(
          circle at top left,
          rgba(167, 139, 250, 0.07),
          transparent 30%
        ),
        radial-gradient(
          circle at top right,
          rgba(96, 165, 250, 0.05),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    .container {

      max-width: 1200px;

      margin: 0 auto;

    }


    /* =========================
       HEADER
    ========================= */

    header {

      margin-bottom: 22px;

      padding-bottom: 20px;

      border-bottom:
        1px solid
        rgba(255,255,255,0.06);

    }


    .brand-row {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 10px;

    }


    /* HH LOGO */

    .heehee-logo {

      width: 42px;

      height: 42px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 12px;

      background:
        var(--gradient);

      color: #09090d;

      font-size: 15px;

      font-weight: 900;

      letter-spacing: -1px;

      box-shadow:
        0 0 24px
        rgba(167, 139, 250, 0.18);

      position: relative;

      overflow: hidden;

    }


    .heehee-logo::after {

      content: "";

      position: absolute;

      inset: 1px;

      border-radius: 11px;

      border:
        1px solid
        rgba(255,255,255,0.25);

      pointer-events: none;

    }


    .brand {

      font-size: 13px;

      font-weight: 800;

      letter-spacing: 3px;

      color: var(--purple-bright);

      margin: 0;

    }


    h1 {

      margin: 0;

      font-size: 32px;

      letter-spacing: -0.8px;

    }


    .subtitle {

      margin-top: 7px;

      color: var(--text-muted);

      font-size: 14px;

    }


    /* =========================
       ACCOUNT
    ========================= */

    .account-bar {

      display: flex;

      justify-content: flex-end;

      align-items: center;

      gap: 10px;

      margin-bottom: 20px;

    }


    .account-name {

      color: var(--text-soft);

      font-size: 13px;

    }


    button {

      font-family: inherit;

    }


    .account-button {

      border:
        1px solid
        var(--border);

      background:
        var(--surface-2);

      color: var(--text);

      padding: 8px 14px;

      border-radius: 8px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;

    }


    .account-button:hover {

      background:
        var(--surface-3);

      border-color:
        var(--border-hover);

      transform:
        translateY(-1px);

    }


    /* =========================
       LOGIN
    ========================= */

    .login-panel {

      margin-bottom: 25px;

      padding: 18px;

      border:
        1px solid
        var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(167,139,250,0.07),
          rgba(96,165,250,0.03)
        ),
        var(--surface);

      box-shadow:
        0 12px 35px
        rgba(0,0,0,0.18);

    }


    .login-panel h2 {

      margin-top: 0;

      margin-bottom: 15px;

      font-size: 18px;

    }


    .login-fields {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

    }


    .login-fields input {

      flex: 1;

      min-width: 200px;

      padding: 10px;

      border-radius: 8px;

      border:
        1px solid
        var(--border);

      background:
        var(--surface-2);

      color: var(--text);

      outline: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;

    }


    .login-fields input:focus {

      border-color:
        var(--purple);

      box-shadow:
        0 0 0 3px
        rgba(167,139,250,0.10);

    }


    .login-submit {

      padding: 10px 18px;

      border-radius: 8px;

      border: none;

      background:
        var(--gradient);

      color: #09090d;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    }


    .login-submit:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 5px 18px
        rgba(167,139,250,0.20);

    }


    .login-message {

      margin-top: 10px;

      font-size: 13px;

      color: var(--text-muted);

    }


    /* =========================
       CONTROLS
    ========================= */

    .controls {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 12px;

    }


    .controls input,
    .controls select {

      padding: 10px;

      border-radius: 8px;

      border:
        1px solid
        var(--border);

      background:
        var(--surface-2);

      color: var(--text);

      outline: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;

    }


    .controls input {

      flex: 1;

      min-width: 220px;

    }


    .controls input:focus,
    .controls select:focus {

      border-color:
        var(--purple);

      box-shadow:
        0 0 0 3px
        rgba(167,139,250,0.08);

    }


    /* =========================
       COLLECTION FILTERS
    ========================= */

    .collection-filters {

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-bottom: 20px;

    }


    .collection-filter {

      padding: 8px 14px;

      border-radius: 8px;

      border:
        1px solid
        var(--border);

      background:
        var(--surface-2);

      color:
        var(--text-muted);

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;

    }


    .collection-filter:hover {

      background:
        var(--surface-3);

      color:
        var(--text);

    }


    .collection-filter.active {

      background:
        rgba(167,139,250,0.12);

      border-color:
        rgba(167,139,250,0.45);

      color:
        var(--purple-bright);

      box-shadow:
        0 0 15px
        rgba(167,139,250,0.06);

    }


    /* =========================
       COLLECTION DASHBOARD
    ========================= */

    .collection-dashboard {

      margin: 25px 0;

      padding: 18px;

      border:
        1px solid
        var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(167,139,250,0.045),
          rgba(96,165,250,0.025)
        ),
        var(--surface);

    }


    .collection-header {

      margin-bottom: 16px;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .collection-title {

      font-size: 20px;

      font-weight: 700;

    }


    .collection-player {

      margin-top: 4px;

      font-size: 13px;

      color:
        var(--text-muted);

    }


    .collection-stats {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 8px;

    }


    .collection-stat {

      padding: 12px;

      border-radius: 9px;

      background:
        var(--surface-2);

      border:
        1px solid
        rgba(255,255,255,0.035);

      text-align: center;

    }


    .collection-stat-number {

      font-size: 20px;

      font-weight: 700;

    }


    .collection-stat-label {

      margin-top: 3px;

      font-size: 11px;

      color:
        var(--text-muted);

    }


    /* =========================
       PROGRESS
    ========================= */

    .collection-progress {

      margin-top: 16px;

    }


    .collection-progress-top {

      display: flex;

      justify-content: space-between;

      margin-bottom: 6px;

      font-size: 12px;

      color: var(--text-soft);

    }


    .progress-bar {

      width: 100%;

      height: 7px;

      border-radius: 10px;

      overflow: hidden;

      background:
        var(--surface-3);

    }


    .progress-fill {

      width: 0%;

      height: 100%;

      border-radius: 10px;

      background:
        var(--gradient);

      transition:
        width 0.3s ease;

    }


    /* =========================
       SPRITE GRID
    ========================= */

    .sprite-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(150px, 1fr)
        );

      gap: 12px;

    }


    .sprite-card {

      background:
        var(--surface);

      border:
        1px solid
        var(--border);

      border-radius: 10px;

      overflow: hidden;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;

    }


    .sprite-card:hover {

      transform:
        translateY(-3px);

      border-color:
        var(--border-hover);

      box-shadow:
        0 8px 24px
        rgba(0,0,0,0.25);

    }


    .sprite-card.collection-partial {

      border-color:
        rgba(167,139,250,0.35);

    }


    .sprite-card.collection-complete {

      border-color:
        rgba(96,165,250,0.45);

      box-shadow:
        inset 0 0 0 1px
        rgba(96,165,250,0.05);

    }


    .sprite-image {

      width: 100%;

      height: 140px;

      object-fit: cover;

      display: block;

      background:
        #0d0d11;

    }


    .sprite-info {

      padding:
        9px 10px 10px;

    }


    .sprite-name {

      font-size: 13px;

      font-weight: 600;

      margin-bottom: 4px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    /* =========================
       RARITIES
    ========================= */

    .rarity {

      font-size: 10px;

      margin-bottom: 3px;

      color: var(--text-muted);

    }


    .sprite-card:has(.rarity) .rarity {

      opacity: 0.9;

    }


    .season {

      font-size: 10px;

      color:
        #62626e;

    }


    .sprite-collection-status {

      margin-top: 6px;

      font-size: 10px;

      color:
        #62626e;

    }


    .sprite-collection-status.partial {

      color:
        var(--purple);

    }


    .sprite-collection-status.complete {

      color:
        var(--blue-bright);

      font-weight: 600;

    }


    .message {

      grid-column:
        1 / -1;

      padding: 30px;

      text-align: center;

      color:
        var(--text-muted);

    }


    /* =========================
       MODAL
    ========================= */

    .modal {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 30px;

      background:
        rgba(0,0,0,0.78);

      backdrop-filter:
        blur(4px);

      z-index: 1000;

    }


    .modal.show {

      display: flex;

    }


    .modal-content {

      width:
        min(560px, 90vw);

      max-height:
        80vh;

      overflow-y: auto;

      padding: 16px;

      position: relative;

      background:
        var(--surface);

      border:
        1px solid
        var(--border);

      border-radius: 12px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.55);

    }


    .modal-close {

      position: absolute;

      top: 8px;

      right: 8px;

      width: 30px;

      height: 30px;

      border:
        1px solid
        var(--border);

      border-radius: 50%;

      background:
        var(--surface-3);

      color: var(--text);

      font-size: 17px;

      line-height: 28px;

      text-align: center;

      cursor: pointer;

      z-index: 5;

      transition:
        background 0.15s ease;

    }


    .modal-close:hover {

      background:
        #30303b;

    }


    /* =========================
       MODAL SPRITE INFO
    ========================= */

    .modal-main {

      display: grid;

      grid-template-columns:
        120px 1fr;

      gap: 14px;

      align-items: start;

      margin-bottom: 14px;

      padding-right: 25px;

    }


    .modal-image {

      width: 120px;

      height: 120px;

      object-fit: cover;

      border-radius: 8px;

      background:
        #0d0d11;

    }


    .modal-title {

      margin:
        0 0 6px 0;

      font-size: 19px;

      font-weight: 700;

    }


    .modal-rarity,
    .modal-season {

      margin-bottom: 3px;

      font-size: 11px;

      color:
        var(--text-muted);

    }


    .modal-description {

      margin-top: 8px;

      font-size: 12px;

      line-height: 1.4;

      color:
        var(--text-soft);

    }


    .modal-ability {

      margin-top: 7px;

      font-size: 12px;

      line-height: 1.4;

      color:
        #d0d0da;

    }


    /* =========================
       VARIANTS
    ========================= */

    .variants-title {

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;

      color:
        var(--purple-bright);

    }


    #modalVariants {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(120px, 1fr)
        );

      gap: 8px;

    }


    .variant-card {

      background:
        #0e0e13;

      border:
        1px solid
        var(--border);

      border-radius: 8px;

      overflow: hidden;

      transition:
        border-color 0.15s ease;

    }


    .variant-card:hover {

      border-color:
        var(--border-hover);

    }


    .variant-image {

      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      display: block;

      background:
        var(--surface-2);

    }


    .variant-info {

      padding: 7px;

    }


    .variant-name {

      margin-bottom: 2px;

      font-size: 11px;

      font-weight: 700;

    }


    .variant-type {

      margin-bottom: 6px;

      font-size: 9px;

      color:
        var(--text-muted);

    }


    .variant-controls {

      display: flex;

      flex-direction: column;

      gap: 5px;

    }


    .owned-button,
    .mastered-button {

      width: 100%;

      padding: 6px;

      border:
        1px solid
        var(--border);

      border-radius: 5px;

      background:
        var(--surface-2);

      color:
        var(--text-soft);

      font-size: 10px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;

    }


    .owned-button:hover,
    .mastered-button:hover {

      background:
        var(--surface-3);

      color:
        var(--text);

    }


    .owned-button.owned {

      background:
        rgba(167,139,250,0.13);

      color:
        var(--purple-bright);

      border-color:
        rgba(167,139,250,0.35);

    }


    .mastered-button.mastered {

      background:
        rgba(96,165,250,0.12);

      color:
        var(--blue-bright);

      border-color:
        rgba(96,165,250,0.35);

    }


    .level-control {

      display: flex;

      align-items: center;

      gap: 5px;

    }


    .level-control label {

      font-size: 9px;

      color:
        var(--text-muted);

    }


    .level-input {

      width: 100%;

      min-width: 0;

      padding: 5px;

      border:
        1px solid
        var(--border);

      border-radius: 5px;

      background:
        var(--surface-2);

      color:
        var(--text);

      font-size: 10px;

      outline: none;

    }


    .level-input:focus {

      border-color:
        var(--purple);

    }


    .no-variants {

      grid-column:
        1 / -1;

      padding: 15px;

      text-align: center;

      color:
        var(--text-muted);

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      body {

        padding:
          20px 12px;

      }


      .brand-row {

        gap: 10px;

      }


      .heehee-logo {

        width: 38px;

        height: 38px;

        border-radius: 10px;

      }


      h1 {

        font-size: 26px;

      }


      .modal {

        padding: 12px;

      }


      .modal-content {

        width: 100%;

        max-height: 92vh;

        padding: 14px;

      }


      .modal-main {

        grid-template-columns:
          1fr;

      }


      .modal-image {

        width: 140px;

        height: 140px;

        margin: 0 auto;

      }


      #modalVariants {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

      }

    }


    @media (max-width: 600px) {

      .collection-stats {

        grid-template-columns:
          repeat(2, 1fr);

      }


      .sprite-grid {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

      }


      .sprite-image {

        height: 130px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <header>


      <div class="brand-row">

        <div class="heehee-logo">
          HH
        </div>

        <div class="brand">
          HEEHEE
        </div>

      </div>


      <h1>
        Fortnite Sprite Tracker
      </h1>


      <div class="subtitle">
        Shamone
      </div>


    </header>


    <!-- =========================
         ACCOUNT
    ========================= -->

    <div class="account-bar">
  <span id="accountName" class="account-name">Not logged in</span>

  <button id="loginButton" class="account-button">
    Login
  </button>

  <button id="registerButton" class="account-button">
    Create Account
  </button>

  <button id="logoutButton" class="account-button" style="display: none;">
    Logout
  </button>
</div>


    <!-- =========================
         LOGIN PANEL
    ========================= -->

    <div
      id="loginPanel"
      class="login-panel"
      style="display: none;"
    >


      <h2>
        Login
      </h2>


      <div class="login-fields">


        <input
          id="emailInput"
          type="email"
          placeholder="Email"
        >


        <input
          id="passwordInput"
          type="password"
          placeholder="Password"
        >


        <button
          id="loginSubmit"
          class="login-submit"
        >
          Login
        </button>


      </div>


      <div
        id="loginMessage"
        class="login-message"
      ></div>


    </div>
<div id="registerPanel" class="login-panel" style="display: none;">
  <h2>Create Account</h2>

  <div class="login-fields">

    <input
      id="registerDisplayName"
      type="text"
      placeholder="Display Name"
      maxlength="50"
    >

    <input
      id="registerDiscordName"
      type="text"
      placeholder="Discord Name"
      maxlength="50"
    >

    <input
      id="registerEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Password"
    >

    <input
      id="registerPasswordConfirm"
      type="password"
      placeholder="Confirm Password"
    >

    <button id="registerSubmit" class="login-submit">
      Create Account
    </button>

  </div>

  <div id="registerMessage" class="login-message"></div>
</div>

    <!-- =========================
         CONTROLS
    ========================= -->

    <div class="controls">


      <input
        id="search"
        type="text"
        placeholder="Search sprites..."
      >


      <select id="rarity">


        <option value="All">
          All Rarities
        </option>


        <option value="Rare">
          Rare
        </option>


        <option value="Epic">
          Epic
        </option>


        <option value="Legendary">
          Legendary
        </option>


        <option value="Mythic">
          Mythic
        </option>


      </select>


    </div>


    <!-- =========================
         COLLECTION FILTERS
    ========================= -->

    <div class="collection-filters">


      <button
        class="collection-filter active"
        data-filter="all"
      >
        All
      </button>


      <button
        class="collection-filter"
        data-filter="owned"
      >
        Owned
      </button>


      <button
        class="collection-filter"
        data-filter="missing"
      >
        Missing
      </button>


      <button
        class="collection-filter"
        data-filter="mastered"
      >
        Mastered
      </button>


    </div>


    <!-- =========================
         COLLECTION DASHBOARD
    ========================= -->

    <div
      id="collectionDashboard"
      class="collection-dashboard"
    >


      <div class="collection-header">


        <div>


          <div class="collection-title">
            My Collection
          </div>


          <div class="collection-player">


            <span id="collectionPlayer">
              Not logged in
            </span>


          </div>


        </div>


      </div>


      <div class="collection-stats">


        <div class="collection-stat">


          <div
            id="collectionTotal"
            class="collection-stat-number"
          >
            0
          </div>


          <div class="collection-stat-label">
            Total
          </div>


        </div>


        <div class="collection-stat">


          <div
            id="collectionOwned"
            class="collection-stat-number"
          >
            0
          </div>


          <div class="collection-stat-label">
            Owned
          </div>


        </div>


        <div class="collection-stat">


          <div
            id="collectionMissing"
            class="collection-stat-number"
          >
            0
          </div>


          <div class="collection-stat-label">
            Missing
          </div>


        </div>


        <div class="collection-stat">


          <div
            id="collectionMastered"
            class="collection-stat-number"
          >
            0
          </div>


          <div class="collection-stat-label">
            Mastered
          </div>

      const headers = {

          "Bearer " +

        "Content-Type":

      return fetch(
        SUPABASE_URL + endpoint,
        {

          headers
        }
      );


    }

async function register() {
  const displayName = document
    .getElementById("registerDisplayName")
    .value

  const discordName = document
    .getElementById("registerDiscordName")
    .value
    .trim();

  const email = document
    .getElementById("registerEmail")
    .value
    .trim();

  const password = document
    .getElementById("registerPassword")
    .value;

  const passwordConfirm = document
    .getElementById("registerPasswordConfirm")
    .value;

  message.textContent = "";

  if (!displayName || !discordName || !email || !password || !passwordConfirm) {
    message.textContent = "Please fill in all fields.";

  }

  if (password !== passwordConfirm) {
    message.textContent = "Passwords do not match.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  message.textContent = "Creating account...";

  try {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/signup",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.msg ||
        data.message ||
        data.error_description ||
        "Could not create account."
      );
    }

    const user = data.user;

    if (!user) {
      throw new Error("Account was created, but no user was returned.");
    }

    /*

     */
    const playerId = crypto.randomUUID();

    const playerResponse = await supabaseRequest(
      "/rest/v1/players",
      {
        method: "POST",
        body: JSON.stringify({
          player_id: playerId,
          discord_id: null,
          discord_name: discordName,
          display_name: displayName,
          active: true,
          admin: false,
          auth_user_id: user.id
        })
      }
    );

    if (!playerResponse.ok) {
      const error = await playerResponse.text();

      throw new Error(
        "Account created, but player profile could not be created: " +
        error
      );
    }

    message.textContent =
      "Account created successfully! You can now log in.";

    document.getElementById("registerPassword").value = "";
    document.getElementById("registerPasswordConfirm").value = "";

  } catch (error) {
    console.error("Registration error:", error);
    message.textContent = error.message;
  }
}

    /* =========================
       RENDER SPRITES
    ========================= */

    function renderSprites() {


      const container =
        document.getElementById(
          "sprites"
        );


      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase();


      const rarity =
        document.getElementById(
          "rarity"
        ).value;


      const activeFilter =
        document.querySelector(
          ".collection-filter.active"
        )?.dataset.filter ||
        "all";


      const filtered =
        allSprites.filter(
          sprite => {


            const name =
              sprite.sprite_name ||
              "";


            const matchesSearch =
              name
                .toLowerCase()
                .includes(search);


            const matchesRarity =
              rarity === "All" ||
              sprite.rarity === rarity;


            if (
              !matchesSearch ||
              !matchesRarity
            ) {


              return false;


            }


            const spriteVariants =
              allVariants.filter(
                variant =>
                  variant.sprite_id ===
                    sprite.sprite_id &&
                  variant.active !== false
              );


            const ownedVariants =
              spriteVariants.filter(
                variant => {


                  const collection =
                    myCollection.find(
                      item =>
                        item.variant_id ===
                        variant.variant_id
                    );


                  return (
                    collection?.owned ===
                    true
                  );


                }
              );


            const masteredVariants =
              spriteVariants.filter(
                variant => {


                  const collection =
                    myCollection.find(
                      item =>
                        item.variant_id ===
                        variant.variant_id
                    );


                  return (
                    collection?.mastered ===
                    true
                  );


                }
              );


            if (
              activeFilter ===
              "owned"
            ) {


              return (
                ownedVariants.length >
                0
              );


            }


            if (
              activeFilter ===
              "missing"
            ) {


              return (
                ownedVariants.length <
                spriteVariants.length
              );


            }


            if (
              activeFilter ===
              "mastered"
            ) {


              return (
                masteredVariants.length >
                0
              );


            }


            return true;


          }
        );


      container.innerHTML = "";


      if (!filtered.length) {


        container.innerHTML = `

          <div class="message">

            No sprites found.

          </div>

        `;


        updateStats(0);


        return;


      }


      filtered.forEach(
        sprite => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "sprite-card";


          const spriteVariants =
            allVariants.filter(
              variant =>
                variant.sprite_id ===
                  sprite.sprite_id &&
                variant.active !== false
            );


          const ownedCount =
            spriteVariants.filter(
              variant => {


                const collection =
                  myCollection.find(
                    item =>
                      item.variant_id ===
                      variant.variant_id
                  );


                return (
                  collection?.owned ===
                  true
                );


              }
            ).length;


          const totalVariants =
            spriteVariants.length;


          let collectionStatus =
            totalVariants === 0
              ? "No variants"
              : `0 / ${totalVariants} variants owned`;


          let statusClass = "";


          if (
            totalVariants > 0 &&
            ownedCount ===
              totalVariants
          ) {


            collectionStatus =
              "✓ Complete";


            statusClass =
              "complete";


            card.classList.add(
              "collection-complete"
            );


          } else if (
            ownedCount > 0
          ) {


            collectionStatus =
              `${ownedCount} / ${totalVariants} variants owned`;


            statusClass =
              "partial";


            card.classList.add(
              "collection-partial"
            );


          }


          card.innerHTML = `

            <img
              class="sprite-image"
              src="${sprite.image_url || ""}"
              alt="${sprite.sprite_name || ""}"
            >


            <div class="sprite-info">


              <div class="sprite-name">
                ${sprite.sprite_name || "Unknown"}
              </div>


              <div class="rarity">
                ${sprite.rarity || "Unknown"}
              </div>


              <div class="season">
                ${sprite.season || ""}
              </div>


              <div
                class="sprite-collection-status ${statusClass}"
              >
                ${collectionStatus}
              </div>


            </div>

          `;


          card.addEventListener(
            "click",
            () =>
              openModal(sprite)
          );


          container.appendChild(
            card
          );


        }
      );


      updateStats(
        filtered.length
      );


    }

    function updateStats(

    /* =========================
       COLLECTION STATS
    ========================= */

    function updateCollectionStats() {


      const total =
        allVariants.filter(
          variant =>
            variant.active !== false
        ).length;


      const owned =
        myCollection.filter(
          item =>
            item.owned === true
        ).length;


      const mastered =
        myCollection.filter(
          item =>
            item.mastered === true
        ).length;


      const missing =
        Math.max(
          total - owned,
          0
        );


      const completion =
        total > 0
          ? Math.round(
              (owned / total) * 100
            )
          : 0;


      const mastery =
        owned > 0
          ? Math.round(
              (mastered / owned) * 100
            )
          : 0;


      const totalElement =
        document.getElementById(
          "collectionTotal"
        );


      const ownedElement =
        document.getElementById(
          "collectionOwned"
        );


      const missingElement =
        document.getElementById(
          "collectionMissing"
        );


      const masteredElement =
        document.getElementById(
          "collectionMastered"
        );


      const completionElement =
        document.getElementById(
          "collectionCompletion"
        );


      const progressElement =
        document.getElementById(
          "collectionProgressFill"
        );


      const masteryElement =
        document.getElementById(
          "masteryCompletion"
        );


      const masteryProgressElement =
        document.getElementById(
          "masteryProgressFill"
        );


      if (totalElement) {

        totalElement.textContent =
          total;

      }


      if (ownedElement) {

        ownedElement.textContent =
          owned;

      }


      if (missingElement) {

        missingElement.textContent =
          missing;

      }


      if (masteredElement) {

        masteredElement.textContent =
          mastered;

      }


      if (completionElement) {

        completionElement.textContent =
          completion + "%";

      }


      if (progressElement) {

        progressElement.style.width =
          completion + "%";

      }


      if (masteryElement) {

        masteryElement.textContent =
          mastery + "%";

      }


      if (masteryProgressElement) {

        masteryProgressElement.style.width =
          mastery + "%";

      }


      const playerElement =
        document.getElementById(
          "collectionPlayer"
        );


      if (playerElement) {

        playerElement.textContent =
          currentPlayer
            ? (
                currentPlayer.display_name ||
                "Logged in"
              )
            : "Not logged in";

      }


    }

                  );


                  alert(
                    "Could not update mastery."
                  );


                }


              }
            );


          }


          container.appendChild(
            card
          );


        }
      );


    }


    /* =========================
       TOGGLE OWNED
    ========================= */

    async function toggleOwned(
      variantId
    ) {


      if (
        !currentPlayer ||
        !accessToken
      ) {


        alert(
          "Please log in first."
        );


        return;


      }


      const existing =
        myCollection.find(
          item =>
            item.variant_id ===
            variantId
        );


      const now =
        new Date().toISOString();


      if (existing) {


        const newOwned =
          existing.owned !== true;


        const response =
          await supabaseRequest(
            "/rest/v1/collections" +
            "?player_id=eq." +
            encodeURIComponent(
              currentPlayer.player_id
            ) +
            "&variant_id=eq." +
            encodeURIComponent(
              variantId
            ),
            {


              method: "PATCH",


              headers: {


                "Prefer":
                  "return=representation"


              },


              body:
                JSON.stringify({


                  owned:
                    newOwned,


                  last_updated:
                    now


                })


            }
          );


        if (!response.ok) {


          const error =
            await response.text();


          throw new Error(
            "Could not update collection: " +
            error
          );


        }


        const updated =
          await response.json();


        if (updated.length) {


          const index =
            myCollection.findIndex(
              item =>
                item.variant_id ===
                variantId
            );


          if (index !== -1) {


            myCollection[index] =
              updated[0];


          }


        }


        updateCollectionStats();

        renderSprites();


        return;


      }


      const collectionId =
        "COL_" +
        currentPlayer.player_id +
        "_" +
        variantId;


      const response =
        await supabaseRequest(
          "/rest/v1/collections",
          {


            method: "POST",


            headers: {


              "Prefer":
                "return=representation"


            },


            body:
              JSON.stringify({


                collection_id:
                  collectionId,


                player_id:
                  currentPlayer.player_id,


                variant_id:
                  variantId,


                owned:
                  true,


                level:
                  null,


                mastered:
                  false,


                last_updated:
                  now,


                first_collected:
                  now,


                first_mastered:
                  null


              })


          }
        );


      if (!response.ok) {


        const error =
          await response.text();


        throw new Error(
          "Could not add to collection: " +
          error
        );


      }


      const created =
        await response.json();


      if (created.length) {


        myCollection.push(
          created[0]
        );


      }


      updateCollectionStats();

      renderSprites();


    }


    /* =========================
       UPDATE LEVEL
    ========================= */

    async function updateVariantLevel(
      variantId,
      level
    ) {


      if (
        !currentPlayer ||
        !accessToken
      ) {


        return;


      }


      const response =
        await supabaseRequest(
          "/rest/v1/collections" +
          "?player_id=eq." +
          encodeURIComponent(
            currentPlayer.player_id
          ) +
          "&variant_id=eq." +
          encodeURIComponent(
            variantId
          ),
          {


            method: "PATCH",


            headers: {


              "Prefer":
                "return=representation"


            },


            body:
              JSON.stringify({


                level:
                  level === ""
                    ? null
                    : Number(level),


                last_updated:
                  new Date().toISOString()


              })


          }
        );


      if (!response.ok) {


        const error =
          await response.text();


        throw new Error(
          "Could not update level: " +
          error
        );


      }


      const updated =
        await response.json();


      if (updated.length) {


        const index =
          myCollection.findIndex(
            item =>
              item.variant_id ===
              variantId
          );


        if (index !== -1) {


          myCollection[index] =
            updated[0];


        }


      }


      updateCollectionStats();

      renderSprites();


    }


    /* =========================
       TOGGLE MASTERED
    ========================= */

    async function toggleMastered(
      variantId
    ) {


      if (
        !currentPlayer ||
        !accessToken
      ) {


        return;


      }


      const existing =
        myCollection.find(
          item =>
            item.variant_id ===
            variantId
        );


      if (!existing) {


        return;


      }


      const newMastered =
        existing.mastered !== true;


      const now =
        new Date().toISOString();


      const response =
        await supabaseRequest(
          "/rest/v1/collections" +
          "?player_id=eq." +
          encodeURIComponent(
            currentPlayer.player_id
          ) +
          "&variant_id=eq." +
          encodeURIComponent(
            variantId
          ),
          {


            method: "PATCH",


            headers: {


              "Prefer":
                "return=representation"


            },


            body:
              JSON.stringify({


                mastered:
                  newMastered,


                first_mastered:
                  newMastered
                    ? (
                        existing.first_mastered ||
                        now
                      )
                    : existing.first_mastered,


                last_updated:
                  now


              })


          }
        );


      if (!response.ok) {


        const error =
          await response.text();


        throw new Error(
          "Could not update mastered: " +
          error
        );


      }


      const updated =
        await response.json();


      if (updated.length) {


        const index =
          myCollection.findIndex(
            item =>
              item.variant_id ===
              variantId
          );


        if (index !== -1) {


          myCollection[index] =
            updated[0];


        }


      }


      updateCollectionStats();

      renderSprites();


    }


    /* =========================
       EVENTS
    ========================= */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        renderSprites
      );


    document
      .getElementById("rarity")
      .addEventListener(
        "change",
        renderSprites
      );


    document
      .querySelectorAll(
        ".collection-filter"
      )
      .forEach(
        button => {


          button.addEventListener(
            "click",
            () => {


              document
                .querySelectorAll(
                  ".collection-filter"
                )
                .forEach(
                  filterButton => {


                    filterButton.classList.remove(
                      "active"
                    );


                  }
                );


              button.classList.add(
                "active"
              );


              renderSprites();


            }
          );


        }
      );


    document.getElementById("loginButton").addEventListener("click", () => {
  const loginPanel = document.getElementById("loginPanel");
  const registerPanel = document.getElementById("registerPanel");

  loginPanel.style.display =
    loginPanel.style.display === "none" ? "block" : "none";

  registerPanel.style.display = "none";
});


    document
      .getElementById("loginSubmit")
      .addEventListener(
        "click",
        login
      );
document.getElementById("registerButton").addEventListener("click", () => {
  const registerPanel = document.getElementById("registerPanel");
  const loginPanel = document.getElementById("loginPanel");

  registerPanel.style.display =
    registerPanel.style.display === "none" ? "block" : "none";

  loginPanel.style.display = "none";
});
    document.getElementById("registerSubmit").addEventListener("click", register);

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        logout
      );


    document
      .getElementById("modalClose")
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById("spriteModal")
      .addEventListener(
        "click",
        event => {


          if (
            event.target.id ===
            "spriteModal"
          ) {


            closeModal();


          }


        }
      );


    document.addEventListener(
      "keydown",
      event => {


        if (
          event.key ===
          "Escape"
        ) {


          closeModal();


        }


      }
    );


    /* =========================
       START TRACKER
    ========================= */

    async function startTracker() {


      try {


        await Promise.all([


          loadSprites(),


          loadVariants(),


          restoreSession()


        ]);


        updateCollectionStats();

        updateAccountUI();

        renderSprites();


      } catch (error) {


        console.error(
          "Tracker error:",
          error
        );


        document.getElementById(
          "stats"
        ).textContent =
          "Tracker error: " +
          error.message;


      }


    }


    startTracker();


  </script>
